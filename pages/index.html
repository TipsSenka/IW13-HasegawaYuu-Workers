<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker API 確認ページ</title>
  <style>
    :root {
      --bg1: #f5f7ff;
      --bg2: #eef6ff;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: #ffffff;
      --border: rgba(148,163,184,0.32);
      --primary: #4f46e5;
      --primary-strong: #312e81;
      --text: #172033;
      --muted: #536179;
      --shadow: 0 20px 45px rgba(79, 70, 229, 0.12);
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --success: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79, 70, 229, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      padding: 40px 20px;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.08);
      color: var(--primary-strong);
      margin-bottom: 16px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: 0 0 16px rgba(79, 70, 229, 0.5);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.2;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 18px 0;
    }

    label {
      font-weight: 700;
      min-width: 110px;
      color: var(--text);
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(255,255,255,0.72);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: rgba(79, 70, 229, 0.8);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 16px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(79, 70, 229, 0.32);
    }

    button.secondary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
    }

    pre {
      margin-top: 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--code-bg), #111827);
      color: var(--code-text);
      padding: 18px 20px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 220px;
      border: 1px solid rgba(148,163,184,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      font-family: "Consolas", "Monaco", monospace;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .card {
        padding: 22px 18px;
      }

      .button-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Cloudflare Workers</div>
    <h1>API 確認ダッシュボード</h1>
    <p class="subtitle">Worker への接続先を確認し、JSON レスポンスをすぐに見るためのページです。</p>

    <div class="row">
      <label for="baseUrl">Worker URL</label>
      <input id="baseUrl" type="text" value="http://127.0.0.1:8787" />
    </div>

    <div class="button-row">
      <button id="courseBtn" type="button">/api/course</button>
      <button id="helloBtn" class="secondary" type="button">/api/hello</button>
      <button id="fortuneBtn" type="button">/api/fortune</button>
      <button id="eventsBtn" class="secondary" type="button">/api/events</button>
    </div>

    <div class="row">
      <label for="name">name</label>
      <input id="name" type="text" value="山田" placeholder="山田" />
    </div>

    <pre id="output">結果がここに表示されます。</pre>
  </div>

  <script>
    const baseUrlInput = document.getElementById('baseUrl');
    const nameInput = document.getElementById('name');
    const output = document.getElementById('output');

    function printResult(message) {
      output.textContent = message;
    }

    async function callApi(path) {
      const baseUrl = (baseUrlInput.value || 'http://127.0.0.1:8787').trim().replace(/\/$/, '');
      const url = `${baseUrl}${path}`;
      printResult(`通信中: ${url}`);

      try {
        const response = await fetch(url);
        const text = await response.text();
        const json = text ? JSON.parse(text) : null;

        printResult(JSON.stringify({
          status: response.status,
          ok: response.ok,
          url,
          data: json
        }, null, 2));
      } catch (error) {
        printResult(
          `通信エラー: ${error.message}\n\n` +
          `確認事項:\n` +
          `1. Worker が起動しているか\n` +
          `2. URL が正しいか\n` +
          `3. ローカル開発なら http://127.0.0.1:8787 を入力\n` +
          `4. 本番公開時は https://<worker-name>.<subdomain>.workers.dev を設定`
        );
      }
    }

    document.getElementById('courseBtn').addEventListener('click', () => {
      callApi('/api/course');
    });

    document.getElementById('helloBtn').addEventListener('click', () => {
      const name = encodeURIComponent(nameInput.value || '');
      callApi(`/api/hello?name=${name}`);
    });

    document.getElementById('fortuneBtn').addEventListener('click', () => {
      const name = encodeURIComponent(nameInput.value || 'あなた');
      callApi(`/api/fortune?name=${name}`);
    });

    document.getElementById('eventsBtn').addEventListener('click', () => {
      callApi('/api/events');
    });
  </script>
</body>
</html>
